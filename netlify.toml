[build]
publish = "src"
command = "npm run check && npm test"

[build.environment]
NODE_VERSION = "22"

[functions]
directory = "netlify/functions"
node_bundler = "esbuild"
external_node_modules = ["bolt11", "ethers", "bitcoinjs-lib"]

[[headers]]
for = "/*"
[headers.values]
X-Content-Type-Options = "nosniff"
Referrer-Policy = "no-referrer"
X-Frame-Options = "DENY"
Permissions-Policy = "camera=(), microphone=(), geolocation=()"
Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-src 'self' about:; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'"
